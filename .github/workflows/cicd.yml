name: cicd

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: cicd-main
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Repository owner lowercase
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.lower.outputs.owner }}/client:latest
          build-args: |
            NEXT_PUBLIC_GBSW_GG_BACKEND_URL=${{ secrets.NEXT_PUBLIC_GBSW_GG_BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Repository owner lowercase
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        env:
          IMAGE: ghcr.io/${{ steps.lower.outputs.owner }}/client:latest
          APP_TIME_ZONE: ${{ secrets.APP_TIME_ZONE }}
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << EOF
            docker pull ${{ env.IMAGE }}
            docker stop gbsw-gg-client || true
            docker rm gbsw-gg-client || true
            docker run -d --name gbsw-gg-client \
              --network app-net \
              -p 80:3000 \
              -e TZ=${{ env.APP_TIME_ZONE }} \
              -e NEXT_PUBLIC_GBSW_GG_BACKEND_URL=${{ secrets.NEXT_PUBLIC_GBSW_GG_BACKEND_URL }} \
              ${{ env.IMAGE }}
          EOF
